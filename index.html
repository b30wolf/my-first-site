<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My practice page</title>
  <style>
    :root {
      --page: #ffffff;
      --text: #1d2433;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #14181f;
        --text: #eef1f6;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--page);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 700;
      text-align: center;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>My practice page</h1>
  </main>
</body>
</html>
